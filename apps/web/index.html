<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 图标三件套：ico 兜底老浏览器（3.3KB），32px PNG 给现代浏览器（2.5KB），
         apple-touch-icon 给 iOS 添加到主屏。都远小于原图 380KB。 -->
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="./favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="description" content="狗蛋书签 —— 收藏想留住的每一个链接。" />
    <meta property="og:title" content="狗蛋书签" />
    <meta property="og:description" content="收藏想留住的每一个链接。" />
    <meta property="og:image" content="./avatar.png" />
    <meta property="og:type" content="website" />
    <title>狗蛋书签</title>
    <script>
      // 防白闪（FOUC）：渲染前先按存储偏好挂 data-theme，与 lib/appearance.ts 规则一致
      try {
        var t = localStorage.getItem('mybookmarks:theme')
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
