# 我的书签 · 生产部署（compose 项目名 mybook，与 my-video 完全隔离）
# 拓扑：db → migrate（一次性）→ api → web（nginx，唯一对外端口 8080）
# 纯 http + IP 访问形态（无域名）：COOKIE_SECURE 必须为 false

name: mybook

services:
  db:
    image: postgres:16-alpine
    container_name: mybook-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mybook
      POSTGRES_PASSWORD: ${DB_PASSWORD:?在 deploy/.env 里设置 DB_PASSWORD}
      POSTGRES_DB: mybook
      TZ: Asia/Shanghai
    # 2G 内存机器的 PG 调优（默认参数会吃爆内存）
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=8MB
      -c max_connections=50
      -c timezone=Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 数据库不发布端口：只在 compose 内网可达
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mybook -d mybook"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 一次性迁移：跑完即退出；api 等它成功后才起
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      target: builder
    container_name: mybook-migrate
    environment:
      DATABASE_URL: postgres://mybook:${DB_PASSWORD:?}@db:5432/mybook
    working_dir: /app
    command: ["pnpm", "--filter", "@my-collection/api", "migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: mybook-api
    environment:
      DATABASE_URL: postgres://mybook:${DB_PASSWORD:?}@db:5432/mybook
      # 容器内必须监听 0.0.0.0，默认的 127.0.0.1 会让容器外访问不到
      HOST: 0.0.0.0
      PORT: 3000
      # 纯 http 下必须 false：Secure cookie 在 http 下不被保存，登录会静默失败
      COOKIE_SECURE: "false"
      TZ: Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: mybook-web
    # 8080：云防火墙已放行且无占用；my-video 独占 80，两边互不干扰
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
