    # my-collection 的 location 集合。HTTP(IP 回退) 与 HTTPS(域名) 两个 server 块共享，
    # 避免同一套规则维护两份导致漂移。root / include 仍留在各自 server 块里。
    # 探活接口：必须不限流，写在 /api/ 之前靠最长前缀优先
    location = /api/v1/healthz {
        include /opt/gateway/nginx/snippets/security-headers.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # 后端 API（前缀原样透传，proxy_pass 不带尾部斜杠或路径）
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        include /opt/gateway/nginx/snippets/security-headers.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # vite 产物带 content hash -> 长缓存
    location /assets/ {
        # 只用 add_header 声明 Cache-Control，不用 expires —— 两者同时写会各生成一条头，
        # 浏览器只取第一条，immutable 会失效
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /opt/gateway/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # index.html 绝不缓存，否则用户永远拿旧版本
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        include /opt/gateway/nginx/snippets/security-headers.conf;
    }

    # HashRouter：hash 不发给服务器，try_files 是双保险
    include /opt/gateway/nginx/locations/crane.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ACME HTTP-01 验证目录：nginx 下面的 dotfile 规则会 deny 一切以 . 开头的路径，
    # 而 /.well-known/acme-challenge/ 正好以点开头。用 ^~ 前缀块抢在正则之前，
    # 只放行这一个目录，其它 .xxx 仍然 403。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/my-collection;
        default_type text/plain;
        access_log off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
