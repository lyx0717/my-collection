# my-collection 全栈项目
# - 前端静态产物挂站点根路径（apps/web/src/lib/api.ts:24 的 BASE 是绝对路径 /api/v1）
# - 后端同源反代 /api/ -> 127.0.0.1:3000
# - 域名 qiyaoqi.pw 已备案（京ICP备2025115934号），443 用 Let's Encrypt 证书
# - 裸 IP 与 my-collection.local 保留在 80 上：域名解析故障、证书过期时仍能进后台
# - location 规则抽取到 /opt/gateway/nginx/locations/my-collection-app.conf，两个 server 共享

# 1) 裸 IP / 本地名：仅 HTTP（IP 上签发不了证书）
server {
    listen 80;
    listen [::]:80;
    server_name 121.36.46.119 my-collection.local;

    root  /var/www/my-collection;
    index index.html;

    access_log /var/log/gateway/my-collection.access.log;
    error_log  /var/log/gateway/my-collection.error.log warn;

    include /opt/gateway/nginx/snippets/gzip.conf;
    include /opt/gateway/nginx/snippets/security-headers.conf;
    include /opt/gateway/nginx/locations/my-collection-app.conf;
}

# 2) 域名 HTTP -> HTTPS（301，保留 host 与路径）
server {
    listen 80;
    listen [::]:80;
    server_name qiyaoqi.pw www.qiyaoqi.pw;

    # 签发/续期证书时 ACME 会走 http-01，跳转必须放行该目录，否则续期失败
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/my-collection;
        default_type text/plain;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 3) 域名 HTTPS：真正对外服务的入口
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qiyaoqi.pw www.qiyaoqi.pw;

    ssl_certificate     /opt/gateway/certs/qiyaoqi.pw/fullchain.pem;
    ssl_certificate_key /opt/gateway/certs/qiyaoqi.pw/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # 不主动开 HSTS：一旦开了，证书出问题或换域名回退到 http 会被浏览器硬拦

    root  /var/www/my-collection;
    index index.html;

    access_log /var/log/gateway/my-collection.access.log;
    error_log  /var/log/gateway/my-collection.error.log warn;

    include /opt/gateway/nginx/snippets/gzip.conf;
    include /opt/gateway/nginx/snippets/security-headers.conf;
    include /opt/gateway/nginx/locations/my-collection-app.conf;
}
