# my-collection 全栈项目
# - 前端静态产物挂站点根路径（apps/web/src/lib/api.ts:24 的 BASE 是绝对路径 /api/v1）
# - 后端同源反代 /api/ -> 127.0.0.1:3000
# - 本 server 不是 default_server，兜底 404 由 00-default.conf 承担
server {
    listen 80;
    listen [::]:80;
    server_name 121.36.46.119 my-collection.local;

    root  /var/www/my-collection;
    index index.html;

    access_log /var/log/gateway/my-collection.access.log;
    error_log  /var/log/gateway/my-collection.error.log warn;

    include /opt/gateway/nginx/snippets/gzip.conf;
    include /opt/gateway/nginx/snippets/security-headers.conf;

    # 探活接口：必须不限流，写在 /api/ 之前靠最长前缀优先
    location = /api/v1/healthz {
        include /opt/gateway/nginx/snippets/security-headers.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # 后端 API（前缀原样透传，proxy_pass 不带尾部斜杠或路径）
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        include /opt/gateway/nginx/snippets/security-headers.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # vite 产物带 content hash -> 长缓存
    location /assets/ {
        # 只用 add_header 声明 Cache-Control，不用 expires —— 两者同时写会各生成一条头，
        # 浏览器只取第一条，immutable 会失效
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /opt/gateway/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # index.html 绝不缓存，否则用户永远拿旧版本
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        include /opt/gateway/nginx/snippets/security-headers.conf;
    }

    # HashRouter：hash 不发给服务器，try_files 是双保险
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
