# 公共 gzip 配置，站点内 include 使用
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/vnd.ms-fontobject
    font/ttf
    font/otf
    font/woff
    font/woff2
    image/svg+xml;
