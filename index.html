<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./avatar.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101216" />
    <meta name="description" content="狗蛋书签 —— 收藏想留住的每一个链接。" />
    <title>狗蛋书签</title>
    <script>
      // 防白闪（FOUC）：渲染前先按存储偏好挂 data-theme，与 lib/appearance.ts 规则一致
      try {
        var t = localStorage.getItem('mybookmarks:theme')
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
