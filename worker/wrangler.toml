name = "my-bookmarks-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# KV 命名空间：部署前先执行
#   npx wrangler kv namespace create BOOKMARKS
# 把输出的 id 填到下面
[[kv_namespaces]]
binding = "BOOKMARKS"
id = "9af2113cf2654c7bb91c5eca122d3627"

[vars]
# 可选：不设置时使用部署时的 Secret AUTH_TOKEN（推荐 Secret）
# 在 Cloudflare 后台或 `npx wrangler secret put AUTH_TOKEN` 设置密码
